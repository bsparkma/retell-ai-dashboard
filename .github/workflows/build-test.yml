name: build-test

# The single CI gate, extracted verbatim from staging.yml so it can run in THREE
# places off one definition:
#   * every pull request targeting develop or main  (on: pull_request)
#   * staging-cd, as job 1                          (uses: ./.github/workflows/build-test.yml)
#   * prod-cd,    as job 1                          (uses: ./.github/workflows/build-test.yml)
#
# Before this file existed, `build-test` only ran AFTER a merge, so every PR was
# reviewed and merged blind and the first red came post-merge.
#
# This file contains NO publish / migrate / deploy job and requests NO
# id-token: write, so a pull_request event cannot mint an OIDC token or reach
# anything in Azure. The Azure jobs live in staging.yml / prod.yml, which are
# gated on `push` and are not triggered by pull_request at all.

on:
  workflow_call: {}
  pull_request:
    branches: [develop, main]

# Force-push to a PR cancels the stale run. When this workflow is CALLED from
# staging-cd / prod-cd the event is a push, so pull_request.number is empty and
# the group falls back to the (unique) run id -- i.e. the callers keep exactly
# the cancellation behaviour they had inline, including prod-cd's deliberate
# `cancel-in-progress: false`.
concurrency:
  group: pr-build-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Deliberately NOT `id-token: write`. A PR must not be able to mint an OIDC token.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carein_owner
          POSTGRES_PASSWORD: carein_owner_devpw
          POSTGRES_DB: carein_control
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carein_owner -d carein_control"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable

      # --- new-dashboard: tsc + vitest ---
      - name: new-dashboard install
        working-directory: new-dashboard
        run: pnpm install --frozen-lockfile
      - name: new-dashboard typecheck (tsc)
        working-directory: new-dashboard
        run: pnpm run check
      - name: new-dashboard tests (vitest)
        working-directory: new-dashboard
        run: pnpm run test

      # --- backend: install + syntax + unit tests ---
      - name: backend install
        working-directory: backend
        run: npm ci
      - name: backend syntax check
        working-directory: backend
        run: node --check server.js
      # Serial on purpose. Node 22.15's parallel test runner intermittently dies with
      # "Unable to deserialize cloned data due to invalid or unsupported version"
      # (ERR_TEST_FAILURE) and blames an arbitrary file — it is a function of the test
      # FILE COUNT, not of any one test. --test-concurrency=1 removes the flake at the
      # cost of a longer run. Do not drop this to "speed CI up".
      - name: backend unit tests
        working-directory: backend
        run: node --test --test-concurrency=1

      # --- spine smoke test (12/12) against an ephemeral Postgres ---
      - name: prepare ephemeral DB (carein_app role + tenant DB)
        env: { PGPASSWORD: carein_owner_devpw }
        run: |
          psql -h localhost -U carein_owner -d carein_control -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='carein_app') THEN CREATE ROLE carein_app LOGIN PASSWORD 'carein_app_devpw'; END IF; END \$\$;"
          psql -h localhost -U carein_owner -d carein_control -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE carein_t_carein OWNER carein_owner;"
          psql -h localhost -U carein_owner -d carein_t_carein -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE ON SCHEMA public TO carein_app;"
      - name: migrate control + tenant (ephemeral, as owner)
        working-directory: backend
        env:
          CONTROL_DB_URL: postgres://carein_owner:carein_owner_devpw@localhost:5432/carein_control
          MIGRATE_TENANT_DB_URL: postgres://carein_owner:carein_owner_devpw@localhost:5432/carein_t_carein
          CAREIN_SEED_CONNECTOR_URL: https://connector-placeholder.ci.local
        run: |
          node scripts/migrate.js up
          node scripts/migrate-tenant.js up --tenant carein
      # The drain's own statements, parsed by the real migrated schema. The unit
      # suite's database is a Map that accepts any column a fixture seeds; this
      # is what would have caught `od_patient_office` before a walk night.
      - name: rcm query verification (real statements, real schema)
        working-directory: backend
        env:
          MIGRATE_TENANT_DB_URL: postgres://carein_owner:carein_owner_devpw@localhost:5432/carein_t_carein
        run: node scripts/rcm-verify-queries.js

      - name: spine smoke test (registry / tenantDb / append-only audit / entitlement)
        working-directory: backend
        env:
          CONTROL_DB_URL: postgres://carein_owner:carein_owner_devpw@localhost:5432/carein_control
          TENANT_CAREIN_DB_URL: postgres://carein_app:carein_app_devpw@localhost:5432/carein_t_carein
        run: node scripts/smoke-spine.js
